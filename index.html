<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EduParty is a free, no-signup game portal for online English classes. Host a room, share a 4-letter PIN, and play STOP, QUIZ, or TABOO together."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded as a non-blocking preload so the font request doesn't hold up
         first paint; display=swap on the stylesheet itself already prevents
         invisible text while it loads. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>EduParty — Education Party Games Portal</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EduParty" />
    <meta property="og:title" content="EduParty — Education Party Games Portal" />
    <meta
      property="og:description"
      content="A free, no-signup game portal for online English classes. Host a room, share a 4-letter PIN, and play STOP, QUIZ, or TABOO together."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EduParty — Education Party Games Portal" />
    <meta
      name="twitter:description"
      content="A free, no-signup game portal for online English classes. Play STOP, QUIZ, and TABOO together."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "EduParty",
        "url": "%VITE_SITE_URL%/",
        "description": "A free, no-signup game portal for online English classes. Play STOP, QUIZ, and TABOO together.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any (runs in the browser)",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
